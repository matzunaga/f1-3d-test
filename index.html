.13 -t.t -19.v -1g.u -s.e -16.i -1r.g -13.4 -z.1 -16.-1 -13.-6 -1f.-a -17.-g -1a.-o -15.-u -15.-y -1s.-1l -y.-15 -13.-1k -13.-1o -1n.-38 -3.-8 -p.-1k -p.-1m -v.-27 -t.-23 -13.-2q -11.-2r -w.-2c -10.-2l -q.-20 -g.-1d -p.-23 -z.-2v -15.-2r -l.-17 -p.-1p -y.-1x -r.-1d -t.-1c -x.-1e -q.-z -x.-14 -x.-12 -19.-1c -1h.-1g -20.-1q -wb.-ss -qt.-ms -10r.-vl -cn.-b6 -5w.-54 -5y.-5c -1s.-1q -3j.-3d -2i.-2f -1m.-1n -1i.-1j -34.-35 -2t.-2x -4i.-4u -3h.-3u -1r.-1y -1i.-1n -3d.-3w -20.-2e -2f.-2r -2g.-2x -1p.-24 -12.-1f -14.-1m -t.-1b -p.-16 -r.-1i -h.-z -j.-13 -l.-18 -m.-1h -k.-1x -m.-28 -f.-1s -d.-20 -b.-1x -9.-2j -3.-1s -3.-1q -2.-1k 0.-1z 6.-33 9.-2a d.-26 f.-24 h.-22 k.-27 t.-2j s.-20 t.-1t k.-17 n.-15 v.-1g o.-16 y.-19 s.-10 z.-14 17.-18 y.-w 1e.-13 1u.-17 1p.-12 1k.-14 1m.-14 1d.-15 1d.-14 1a.-14 1l.-1d 1l.-1g 1w.-1s 28.-28 59.-5k 1n.-1r 1x.-27 2j.-31 1g.-1v 1b.-1n 1j.-20 1b.-1w 36.-4m 17.-20 8k.-d4 6d.-95 ah.-ed 4d.-60 s.-1a m.-1h d.-1g 3.-1t -5.-1r -b.-1m -i.-1l -s.-1l -5k.-8z -d.-t -n.-1j -h.-23 -9.-2t 0.-12 1.-1k 9.-1x g.-1q j.-1m x.-1w 1g.-2e 2d.-3m 2d.-3c 2d.-31 s.-z 28.-2f 22.-1v 2r.-2b 2y.-22 30.-1o 2g.-13 2k.-z 18.-c 19.-b 20.-e 1s.6 1g.e 19.q 12.10 19.1h 2g.37 g.j 18.1j";

// Ghost fine-tune (applied on top of the automatic telemetry fit).
let ghostRotDeg = 0, ghostEastM = 0, ghostNorthM = 0;
const DISTANCE_BEHIND = 60;
let cameraHeightM = 1;
let cameraPitchDeg = -5;
let zoomMultiplier = 0.3;
const HIDDEN_BUILDING_IDS = [
  1412628537,   // glass bridge model across the track near the start
  507976158,    // small building on the track near Copse
  507977621,    // small building across the track about 37 s into the lap
];
const CAR_LIFT_M = 1.5;       // red car rides this far above the terrain
const TRACK_STEP_M = 5;       // spacing of the playback points

const ANCHOR_LAT = 52.0717;
const ANCHOR_LON = -1.0159;
const KLAT = 111320;
const KLON = 111320 * Math.cos(ANCHOR_LAT * Math.PI / 180);
const toEN = (lat, lon) => [(lon - ANCHOR_LON) * KLON, (lat - ANCHOR_LAT) * KLAT];
const fromEN = (e, n) => ({ lat: ANCHOR_LAT + n / KLAT, lon: ANCHOR_LON + e / KLON });

const statusEl = document.getElementById("status");
function log(msg) { console.log(msg); statusEl.textContent = msg; }

try {
  if (typeof Cesium === "undefined") {
    throw new Error("Cesium library never loaded — likely a slow or blocked connection to cdnjs.cloudflare.com. Try reloading, or switch networks (wifi vs cellular).");
  }
  Cesium.Ion.defaultAccessToken = CESIUM_ION_TOKEN;
} catch (err) {
  statusEl.textContent = "FAILED before setup: " + err.message;
  throw err;
}

let viewer, terrainProvider;
let carFrames = [];
let lapBoundaries = [];
let trackEN = [];              // closed loop, local east/north meters, starts at the start/finish line
let trackCart = [];            // same points as Cartesian at terrain height + lift
let trackGroundCart = [];      // same points at height 0, for the clamped yellow line
let trackHeadings = [];
let TRACK_LENGTH_M = 5890, trackStepM = 5;
let trackHeights = [];         // terrain height under each track point
let fit = null;                // telemetry-to-track rigid fit
let trackPolylineEntity = null;
let startFinishEntity = null;

/* ---------- small geometry helpers (all in local east/north meters) ---------- */
const mean2 = pts => { let x = 0, y = 0; pts.forEach(p => { x += p[0]; y += p[1]; }); return [x / pts.length, y / pts.length]; };
const rot2 = (p, th) => [p[0] * Math.cos(th) - p[1] * Math.sin(th), p[0] * Math.sin(th) + p[1] * Math.cos(th)];

function decodeOsmTrack() {
  let a = 0, b = 0;
  const pts = OSM_TRACK_ENC.split(" ").map(s => {
    const [x, y] = s.split(".");
    a += parseInt(x, 36); b += parseInt(y, 36);
    return toEN(a / 1e6, b / 1e6);
  });
  const f = pts[0], l = pts[pts.length - 1];
  if (Math.hypot(f[0] - l[0], f[1] - l[1]) < 0.5) pts.pop();   // loop is stored closed; drop the duplicate
  return pts;
}

function resampleClosed(pts, step) {
  const p = pts.concat([pts[0]]);
  const cum = [0];
  for (let i = 1; i < p.length; i++) cum.push(cum[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
  const L = cum[cum.length - 1], N = Math.round(L / step), out = [];
  let j = 0;
  for (let k = 0; k < N; k++) {
    const s = L * k / N;
    while (j < cum.length - 2 && cum[j + 1] < s) j++;
    const f = (s - cum[j]) / ((cum[j + 1] - cum[j]) || 1);
    out.push([p[j][0] + (p[j + 1][0] - p[j][0]) * f, p[j][1] + (p[j + 1][1] - p[j][1]) * f]);
  }
  return { pts: out, length: L };
}

function resampleOpen(pts, n) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const L = cum[cum.length - 1], out = [];
  let j = 0;
  for (let k = 0; k < n; k++) {
    const s = L * k / (n - 1);
    while (j < cum.length - 2 && cum[j + 1] < s) j++;
    const f = (s - cum[j]) / ((cum[j + 1] - cum[j]) || 1);
    out.push([pts[j][0] + (pts[j + 1][0] - pts[j][0]) * f, pts[j][1] + (pts[j + 1][1] - pts[j][1]) * f]);
  }
  return out;
}

function nearestIdx(q, pts) {
  let best = 1e18, bi = 0;
  for (let i = 0; i < pts.length; i++) {
    const dx = pts[i][0] - q[0], dy = pts[i][1] - q[1], d = dx * dx + dy * dy;
    if (d < best) { best = d; bi = i; }
  }
  return { idx: bi, dist: Math.sqrt(best) };
}

/* ---------- telemetry: OpenF1 x/y are in decimeters, in their own frame ----------
   Find the rotation (and mirror, if needed) plus shift that lays one clean lap
   of telemetry onto the real track: coarse search over angles, then ICP. */
function fitTelemetryToTrack(trackDense, lapXY) {
  const ct = mean2(trackDense);
  const P = resampleOpen(lapXY, 500);
  let best = { err: 1e18 };
  for (const refl of [1, -1]) {
    const Q = P.map(p => [p[0], p[1] * refl]);
    const cq = mean2(Q);
    for (let deg = 0; deg < 360; deg += 5) {
      const th = deg * Math.PI / 180;
      let s = 0;
      for (let i = 0; i < Q.length; i++) {
        const r = rot2([Q[i][0] - cq[0], Q[i][1] - cq[1]], th);
        s += nearestIdx([r[0] + ct[0], r[1] + ct[1]], trackDense).dist;
      }
      const err = s / Q.length;
      if (err < best.err) {
        const rc = rot2(cq, th);
        best = { err, refl, th, t: [ct[0] - rc[0], ct[1] - rc[1]] };
      }
    }
  }
  const apply = (f, p) => { const r = rot2([p[0], p[1] * f.refl], f.th); return [r[0] + f.t[0], r[1] + f.t[1]]; };
  for (let it = 0; it < 40; it++) {
    const cur = P.map(p => apply(best, p));
    const tgt = cur.map(c => trackDense[nearestIdx(c, trackDense).idx]);
    const mp = mean2(cur), mt = mean2(tgt);
    let sd = 0, sc = 0;
    for (let i = 0; i < cur.length; i++) {
      const a = [cur[i][0] - mp[0], cur[i][1] - mp[1]], b = [tgt[i][0] - mt[0], tgt[i][1] - mt[1]];
      sd += a[0] * b[0] + a[1] * b[1]; sc += a[0] * b[1] - a[1] * b[0];
    }
    const dth = Math.atan2(sc, sd);
    const rt = rot2([best.t[0] - mp[0], best.t[1] - mp[1]], dth);
    best = { ...best, th: best.th + dth, t: [rt[0] + mt[0], rt[1] + mt[1]] };
  }
  const d = P.map(p => nearestIdx(apply(best, p), trackDense).dist).sort((a, b) => a - b);
  best.meanErr = d.reduce((a, b) => a + b, 0) / d.length;
  best.p90 = d[Math.floor(d.length * 0.9)];
  best.center = ct;
  best.apply = p => apply(best, p);
  return best;
}

/* Local meters for one telemetry frame, after the fit and the ghost fine-tune. */
function frameToEN(f) {
  const p = fit.apply([f.x / 10, f.y / 10]);
  if (!ghostRotDeg && !ghostEastM && !ghostNorthM) return p;
  const r = rot2([p[0] - fit.center[0], p[1] - fit.center[1]], ghostRotDeg * Math.PI / 180);
  return [r[0] + fit.center[0] + ghostEastM, r[1] + fit.center[1] + ghostNorthM];
}

function lapFrameRange(frameTimes, lap) {
  const startT = lapBoundaries[lap].date_start;
  const endT = lap + 1 < lapBoundaries.length ? lapBoundaries[lap + 1].date_start : Infinity;
  const s = frameTimes.findIndex(t => t >= startT);
  if (s === -1) return null;
  let e = frameTimes.findIndex(t => t >= endT);
  if (e === -1) e = frameTimes.length;
  return [s, e];
}

async function init() {
  log("Setting up Cesium viewer...");
  terrainProvider = await Cesium.createWorldTerrainAsync();
  viewer = new Cesium.Viewer("cesiumContainer", {
    terrainProvider,
    baseLayerPicker: false,
    timeline: false,
    animation: false,
  });
  const osmBuildings = await Cesium.createOsmBuildingsAsync();
  // OSM buildings that the mapping puts on the racing surface. Add more
  // OSM element ids to this list to hide any other offender.
  const hiddenIds = HIDDEN_BUILDING_IDS.map(id => "Number(${elementId}) !== " + id).join(" && ");
  osmBuildings.style = new Cesium.Cesium3DTileStyle({ show: hiddenIds || "true" });
  viewer.scene.primitives.add(osmBuildings);

  try {
    log("Loading telemetry from OpenF1...");
    await loadOpenF1Data();

    log("Building the track from OpenStreetMap and fitting telemetry...");
    const loop = resampleClosed(decodeOsmTrack(), TRACK_STEP_M);
    trackEN = loop.pts;
    TRACK_LENGTH_M = loop.length;
    const dense = resampleClosed(trackEN, 2).pts;

    const frameTimes = carFrames.map(f => new Date(f.date).getTime());
    const fitLap = Math.min(2, lapBoundaries.length - 1);
    const rng = lapFrameRange(frameTimes, fitLap);
    fit = fitTelemetryToTrack(dense, carFrames.slice(rng[0], rng[1]).map(f => [f.x / 10, f.y / 10]));

    // Start/finish: where the real lap-start timestamps sit on the track.
    const starts = [];
    for (let lap = 1; lap < lapBoundaries.length; lap++) {
      const r = lapFrameRange(frameTimes, lap);
      if (r) starts.push(nearestIdx(fit.apply([carFrames[r[0]].x / 10, carFrames[r[0]].y / 10]), trackEN).idx);
    }
    const N = trackEN.length;
    let startIdx = starts[0] || 0, off = 0;
    starts.forEach(s => { let d = s - starts[0]; if (d > N / 2) d -= N; if (d < -N / 2) d += N; off += d; });
    startIdx = ((starts[0] + Math.round(off / starts.length)) % N + N) % N;
    trackEN = trackEN.slice(startIdx).concat(trackEN.slice(0, startIdx));

    await buildTrackGeometry();
    computeLapProgress();
    currentLapIndex = fastestLapIndex;

    log("Ready. Track: " + (loop.length / 1000).toFixed(2) + " km from OpenStreetMap" +
        " | Telemetry fit: mean " + fit.meanErr.toFixed(1) + " m, 90% within " + fit.p90.toFixed(1) + " m" +
        " | Laps: " + REAL_LAP_COUNT_V0 +
        " | First play: lap " + lapBoundaries[fastestLapIndex].lap_number + " (fastest), in real time" + "\nTap Overview to check, or Play next lap.");

    document.getElementById("playBtn").onclick = () => playLap();
    document.getElementById("overviewBtn").onclick = () => showOverview();
    document.getElementById("panelToggle").onclick = () => {
      const body = document.getElementById("panelBody");
      const hide = body.style.display !== "none";
      body.style.display = hide ? "none" : "flex";
      document.getElementById("panelToggle").textContent = hide ? "Show controls" : "Hide controls";
    };

    // Each control is a tap-to-type number input flanked by - / + buttons.
    const controls = {
      zoom: { min: 0.3,  max: 4.0,  onChange: v => { zoomMultiplier = v; } },
      camH: { min: 1,    max: 500,  onChange: v => { cameraHeightM = v; } },
      camP: { min: -90,  max: -5,   onChange: v => { cameraPitchDeg = v; } },
      rot:  { min: -30,  max: 30,   onChange: v => { ghostRotDeg = v; computeLapProgress(); } },
      panE: { min: -300, max: 300,  onChange: v => { ghostEastM = v; computeLapProgress(); } },
      panN: { min: -300, max: 300,  onChange: v => { ghostNorthM = v; computeLapProgress(); } },
    };
    const idFor = { rot: "rotVal", zoom: "zoomVal", panE: "panEVal", panN: "panNVal", camH: "camHVal", camP: "camPVal" };

    Object.keys(controls).forEach(ctl => {
      const { min, max, onChange } = controls[ctl];
      const input = document.getElementById(idFor[ctl]);
      const step = Number(input.step) || 1;
      const commit = (v) => {
        v = Math.max(min, Math.min(max, v));
        input.value = v;
        onChange(v);
      };
      input.addEventListener("change", () => commit(Number(input.value) || 0));
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });

      document.querySelectorAll(`.stepBtn[data-ctl="${ctl}"]`).forEach(btn => {
        const dir = Number(btn.dataset.dir);
        let repeatTimer = null, holdTimeout = null, ticks = 0;
        const doStep = () => commit(Math.round((Number(input.value) + dir * step) * 100) / 100);
        const startHold = () => {
          doStep();
          holdTimeout = setTimeout(() => {
            repeatTimer = setInterval(() => {
              ticks++;
              doStep();
              if (ticks === 15 && repeatTimer) {
                clearInterval(repeatTimer);
                repeatTimer = setInterval(doStep, 60);
              }
            }, 100);
          }, 400);
        };
        const stopHold = () => {
          clearTimeout(holdTimeout);
          clearInterval(repeatTimer);
          repeatTimer = null; ticks = 0;
        };
        btn.addEventListener("pointerdown", (e) => { e.preventDefault(); startHold(); });
        btn.addEventListener("pointerup", stopHold);
        btn.addEventListener("pointerleave", stopHold);
        btn.addEventListener("pointercancel", stopHold);
      });
    });
  } catch (err) {
    log("FAILED: " + err.message);
    console.error(err);
  }
}

function showOverview() {
  const sphere = Cesium.BoundingSphere.fromPoints(trackCart);
  viewer.camera.flyToBoundingSphere(sphere, {
    offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-90), sphere.radius * 2.5),
    duration: 1.5,
  });
}

/* Terrain heights for every track point, then cars/camera ride on the real ground. */
async function buildTrackGeometry() {
  const cartos = trackEN.map(p => { const g = fromEN(p[0], p[1]); return Cesium.Cartographic.fromDegrees(g.lon, g.lat); });
  let heights = cartos.map(() => 0), terrainOk = true;
  try {
    const sampled = await Cesium.sampleTerrainMostDetailed(terrainProvider, cartos);
    heights = sampled.map(c => (typeof c.height === "number" && isFinite(c.height)) ? c.height : 0);
  } catch (e) {
    terrainOk = false;
    console.warn("Terrain sampling failed, using height 0:", e);
  }
  window.__terrainOk = terrainOk;
  trackHeights = heights;
  trackCart = trackEN.map((p, i) => { const g = fromEN(p[0], p[1]); return Cesium.Cartesian3.fromDegrees(g.lon, g.lat, heights[i] + CAR_LIFT_M); });
  trackGroundCart = trackEN.map(p => { const g = fromEN(p[0], p[1]); return Cesium.Cartesian3.fromDegrees(g.lon, g.lat, 0); });

  trackStepM = TRACK_LENGTH_M / trackEN.length;
  const N = trackEN.length, AHEAD = 3;
  trackHeadings = trackEN.map((p, i) => {
    const q = trackEN[(i + AHEAD) % N];
    return Math.atan2(q[0] - p[0], q[1] - p[1]);
  });

  if (trackPolylineEntity) viewer.entities.remove(trackPolylineEntity);
  trackPolylineEntity = viewer.entities.add({
    polyline: {
      positions: trackGroundCart.concat([trackGroundCart[0]]),   // closed loop
      width: 4,
      material: Cesium.Color.fromCssColorString("#E8FF00"),
      clampToGround: true,
    },
  });
  if (startFinishEntity) viewer.entities.remove(startFinishEntity);
  startFinishEntity = viewer.entities.add({
    position: trackCart[0],
    point: { pixelSize: 12, color: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK, outlineWidth: 2 },
    label: { text: "START / FINISH", font: "12px monospace", fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK,
             outlineWidth: 3, style: Cesium.LabelStyle.FILL_AND_OUTLINE, pixelOffset: new Cesium.Cartesian2(0, -18) },
  });
}

/* ---------- OpenF1 ---------- */
async function loadOpenF1Data() {
  // 2026 Silverstone was a Sprint weekend: OpenF1 tags BOTH the Sprint
  // (Saturday) and the Grand Prix (Sunday) as session_type "Race".
  // Match on session_name so this resolves to the real race (key 11326).
  const sessRes = await fetch("https://api.openf1.org/v1/sessions?country_name=United Kingdom&year=2026&session_name=Race");
  const sessions = await sessRes.json();
  if (!sessions.length) throw new Error("No 2026 Great Britain Race session found in OpenF1 (checked session_name=Race).");
  const sessionKey = sessions[0].session_key;

  const drvRes = await fetch(`https://api.openf1.org/v1/drivers?session_key=${sessionKey}`);
  const drivers = await drvRes.json();
  if (!drivers.length) throw new Error("No drivers found for this session.");
  const driver = drivers[0];

  const locRes = await fetch(`https://api.openf1.org/v1/location?session_key=${sessionKey}&driver_number=${driver.driver_number}`);
  carFrames = await locRes.json();
  if (!carFrames.length) throw new Error("No location data returned for driver " + driver.driver_number + ".");

  const lapRes = await fetch(`https://api.openf1.org/v1/laps?session_key=${sessionKey}&driver_number=${driver.driver_number}`);
  const laps = await lapRes.json();
  lapBoundaries = laps
    .filter(l => l.date_start)
    .map(l => ({ lap_number: l.lap_number, date_start: new Date(l.date_start).getTime(), lap_duration: l.lap_duration, pit_out: !!l.is_pit_out_lap }))
    .sort((a, b) => a.date_start - b.date_start);
  if (!lapBoundaries.length) throw new Error("No lap boundary data returned — can't slice laps accurately.");
}

/* ---------- real-time lap playback ----------
   Each real lap becomes a table of (time since the lap started, distance along
   the track). Playback runs on the wall clock, so a lap takes its true lap time
   and the car speeds up and slows down exactly as the real car did. */
const MAX_GHOSTS = 4;
let lapProgress = [];          // aligned with lapBoundaries: { t: ms since lap start, s: track index (continuous), dur: ms } or null
let currentLapIndex = 0;
let fastestLapIndex = 0;
let ghostEntities = [];
let REAL_LAP_COUNT_V0 = 0;

function trackProgressFor(frames, startT) {
  const N = trackEN.length;
  const T = new Float64Array(frames.length), S = new Float64Array(frames.length);
  const segFrac = (p, i0) => {
    const a = trackEN[((i0 % N) + N) % N], b = trackEN[(((i0 + 1) % N) + N) % N];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const tt = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
    return { t: tt, d: Math.hypot(p[0] - (a[0] + dx * tt), p[1] - (a[1] + dy * tt)) };
  };
  let prevIdx = -1, cont = 0;
  for (let k = 0; k < frames.length; k++) {
    const p = frameToEN(frames[k]);
    let best = 1e18, bi = 0;
    const scan = (from, to) => {
      for (let d = from; d <= to; d++) {
        const i = prevIdx < 0 ? d : (((prevIdx + d) % N) + N) % N;
        const dx = trackEN[i][0] - p[0], dy = trackEN[i][1] - p[1], q = dx * dx + dy * dy;
        if (q < best) { best = q; bi = i; }
      }
    };
    if (prevIdx < 0) scan(0, N - 1); else { scan(-8, 60); if (Math.sqrt(best) > 40) { prevIdx = -1; best = 1e18; scan(0, N - 1); } }
    const s1 = segFrac(p, bi), s0 = segFrac(p, bi - 1);
    const frac = s0.d < s1.d ? (bi - 1 + s0.t) : (bi + s1.t);
    if (k === 0) { cont = frac > N / 2 ? frac - N : frac; }
    else {
      const base = ((cont % N) + N) % N;
      let delta = frac - base;
      if (delta > N / 2) delta -= N; if (delta < -N / 2) delta += N;
      cont = Math.max(cont, cont + delta);   // the car never goes backwards
    }
    prevIdx = bi;
    T[k] = new Date(frames[k].date).getTime() - startT;
    S[k] = cont;
  }
  return { t: T, s: S };
}

function computeLapProgress() {
  const frameTimes = carFrames.map(f => new Date(f.date).getTime());
  lapProgress = lapBoundaries.map((lb, lap) => {
    const r = lapFrameRange(frameTimes, lap);
    if (!r || r[1] - r[0] < 10) return null;
    const lp = trackProgressFor(carFrames.slice(r[0], r[1]), lb.date_start);
    const endT = lap + 1 < lapBoundaries.length ? lapBoundaries[lap + 1].date_start : null;
    lp.dur = endT ? endT - lb.date_start : lp.t[lp.t.length - 1];
    return lp;
  });
  REAL_LAP_COUNT_V0 = lapProgress.filter(Boolean).length;
  let bestDur = Infinity;
  lapBoundaries.forEach((lb, i) => {
    if (lapProgress[i] && lb.lap_duration > 0 && !lb.pit_out && lb.lap_duration < bestDur) { bestDur = lb.lap_duration; fastestLapIndex = i; }
  });
}

function progressAt(lp, tms) {
  const T = lp.t, S = lp.s, n = T.length;
  if (tms <= T[0]) return S[0];
  if (tms >= T[n - 1]) return S[n - 1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (T[mid] <= tms) lo = mid; else hi = mid; }
  return S[lo] + (S[hi] - S[lo]) * ((tms - T[lo]) / ((T[hi] - T[lo]) || 1));
}

function trackPointAt(arr, s) {
  const N = arr.length, fl = Math.floor(s), f = s - fl;
  return Cesium.Cartesian3.lerp(arr[((fl % N) + N) % N], arr[(((fl + 1) % N) + N) % N], f, new Cesium.Cartesian3());
}

function headingAt(s) {
  const N = trackHeadings.length, fl = Math.floor(s), f = s - fl;
  const a = trackHeadings[((fl % N) + N) % N], b = trackHeadings[(((fl + 1) % N) + N) % N];
  const d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  return a + d * f;
}

function clearGhostEntities() {
  ghostEntities.forEach(e => viewer.entities.remove(e));
  ghostEntities = [];
}

const fmtLap = ms => { const s = ms / 1000, m = Math.floor(s / 60); return m + ":" + (s - m * 60).toFixed(3).padStart(6, "0"); };

let activePlaybackInterval = null;

function playLap() {
  if (!trackCart.length || !REAL_LAP_COUNT_V0) { log("Data not ready — can't play."); return; }

  if (activePlaybackInterval !== null) { clearInterval(activePlaybackInterval); activePlaybackInterval = null; }
  viewer.camera.cancelFlight();
  clearGhostEntities();

  let guard = 0;
  while (!lapProgress[currentLapIndex] && guard++ < lapProgress.length) currentLapIndex = (currentLapIndex + 1) % lapProgress.length;
  const lapIdx = currentLapIndex;
  const lp = lapProgress[lapIdx];
  const lapNo = lapBoundaries[lapIdx].lap_number;

  const ghostLapIndices = [];
  for (let g = lapIdx - 1; g >= 0 && ghostLapIndices.length < MAX_GHOSTS; g--) if (lapProgress[g]) ghostLapIndices.push(g);

  ghostEntities = ghostLapIndices.map((gi, order) => viewer.entities.add({
    point: {
      pixelSize: 10,
      color: Cesium.Color.fromCssColorString("#E8FF00").withAlpha(Math.max(0.15, 1 - (order + 1) * 0.22)),
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
    },
    position: trackGroundCart[0],
  }));

  const wallStart = performance.now();
  let lastLog = -1e9;

  activePlaybackInterval = setInterval(() => {
    const el = performance.now() - wallStart;
    if (el >= lp.dur) {
      clearInterval(activePlaybackInterval);
      activePlaybackInterval = null;
      currentLapIndex = (lapIdx + 1) % lapBoundaries.length;
      log("Lap " + lapNo + " complete in " + fmtLap(lp.dur) + ". Press Play next lap to continue — " +
          Math.min(ghostLapIndices.length + 1, MAX_GHOSTS) + " ghost(s) will trail next time.");
      return;
    }
    const s = progressAt(lp, el);
    const pos = trackPointAt(trackCart, s);
    const ahead = trackPointAt(trackCart, s + 3);

    const forward = Cesium.Cartesian3.normalize(Cesium.Cartesian3.subtract(ahead, pos, new Cesium.Cartesian3()), new Cesium.Cartesian3());
    const up = Cesium.Cartesian3.normalize(pos, new Cesium.Cartesian3());
    const cameraPos = Cesium.Cartesian3.add(
      Cesium.Cartesian3.add(pos, Cesium.Cartesian3.multiplyByScalar(forward, -DISTANCE_BEHIND * zoomMultiplier, new Cesium.Cartesian3()), new Cesium.Cartesian3()),
      Cesium.Cartesian3.multiplyByScalar(up, cameraHeightM * zoomMultiplier, new Cesium.Cartesian3()),
      new Cesium.Cartesian3()
    );
    viewer.camera.setView({
      destination: cameraPos,
      orientation: { heading: headingAt(s), pitch: Cesium.Math.toRadians(cameraPitchDeg), roll: 0 },
    });

    ghostEntities.forEach((entity, idx) => {
      entity.position = trackPointAt(trackGroundCart, progressAt(lapProgress[ghostLapIndices[idx]], el));
    });

    if (el - lastLog > 250) {
      lastLog = el;
      const a = Math.max(0, el - 250), b = Math.min(lp.dur, el + 250);
      const kmh = (progressAt(lp, b) - progressAt(lp, a)) * trackStepM / ((b - a) / 1000) * 3.6;
      window.__playState = { lapNo, el, s, kmh };
      log("Lap " + lapNo + (lapIdx === fastestLapIndex ? " (fastest)" : "") + "  " + fmtLap(el) + " / " + fmtLap(lp.dur) +
          "\nSpeed from track progress: " + Math.round(kmh) + " km/h  |  " + ghostLapIndices.length + " ghost(s)");
    }
  }, 33);
}

init();
</script>
