<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>F1 3D v0 test — Silverstone, real telemetry, ghost laps</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.120.0/Cesium.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.120.0/Widgets/widgets.css" rel="stylesheet">
<style>
  html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; touch-action: none; }
  #status { position: absolute; top: 10px; left: 10px; z-index: 999; background: #0D0D0D; color: #E8FF00;
            font-family: monospace; font-size: 13px; padding: 10px 14px; max-width: 480px; white-space: pre-wrap; }
  #controls { position: absolute; bottom: 14px; left: 14px; z-index: 999; display: flex; flex-wrap: wrap;
              align-items: center; gap: 14px; background: rgba(13,13,13,0.75); padding: 12px 16px; border-radius: 6px; }
  button { background:#0D0D0D; color:#F0EDE6; border:1px solid #E8FF00; padding:14px 22px; font-family:monospace;
           font-size: 15px; cursor:pointer; border-radius: 4px; }
  button:hover { background:#1a1a1a; }
  #rotWrap { color:#F0EDE6; font-family:monospace; font-size:14px; display:flex; align-items:center; gap:4px; }
  .stepBtn { background:#0D0D0D; color:#E8FF00; border:1px solid #E8FF00; width:36px; height:36px;
             font-family:monospace; font-size:20px; line-height:1; cursor:pointer; border-radius:4px;
             display:flex; align-items:center; justify-content:center; user-select:none; touch-action:manipulation; }
  .stepBtn:active { background:#E8FF00; color:#0D0D0D; }
  .stepInput { width:64px; height:34px; background:#1a1a1a; color:#F0EDE6; border:1px solid #3D3D3D;
               font-family:monospace; font-size:15px; text-align:center; border-radius:4px; }
  .stepInput:focus { outline:2px solid #E8FF00; border-color:#E8FF00; }
  .stepLabel { min-width:88px; }
</style>
</head>
<body>
<div id="status">Loading...</div>
<div id="controls">
  <button id="playBtn">Play next lap</button>
  <button id="overviewBtn">Overview (top-down)</button>
  <label id="rotWrap"><span class="stepLabel">Rotation</span>
    <button class="stepBtn" data-ctl="rot" data-dir="-1">-</button>
    <input class="stepInput" id="rotVal" type="number" step="0.5" value="0">
    <button class="stepBtn" data-ctl="rot" data-dir="1">+</button>&deg;
  </label>
  <label id="rotWrap"><span class="stepLabel">Zoom</span>
    <button class="stepBtn" data-ctl="zoom" data-dir="-1">-</button>
    <input class="stepInput" id="zoomVal" type="number" step="0.1" value="1.0">
    <button class="stepBtn" data-ctl="zoom" data-dir="1">+</button>x
  </label>
  <label id="rotWrap"><span class="stepLabel">Shift E/W</span>
    <button class="stepBtn" data-ctl="panE" data-dir="-1">-</button>
    <input class="stepInput" id="panEVal" type="number" step="1" value="0">
    <button class="stepBtn" data-ctl="panE" data-dir="1">+</button>m
  </label>
  <label id="rotWrap"><span class="stepLabel">Shift N/S</span>
    <button class="stepBtn" data-ctl="panN" data-dir="-1">-</button>
    <input class="stepInput" id="panNVal" type="number" step="1" value="0">
    <button class="stepBtn" data-ctl="panN" data-dir="1">+</button>m
  </label>
  <label id="rotWrap"><span class="stepLabel">Cam Height</span>
    <button class="stepBtn" data-ctl="camH" data-dir="-1">-</button>
    <input class="stepInput" id="camHVal" type="number" step="1" value="150">
    <button class="stepBtn" data-ctl="camH" data-dir="1">+</button>m
  </label>
  <label id="rotWrap"><span class="stepLabel">Cam Pitch</span>
    <button class="stepBtn" data-ctl="camP" data-dir="-1">-</button>
    <input class="stepInput" id="camPVal" type="number" step="1" value="-60">
    <button class="stepBtn" data-ctl="camP" data-dir="1">+</button>&deg;
  </label>
</div>
<div id="cesiumContainer"></div>

<script>
/* ============================================================
   Cesium ion token: client-side tokens are visible to anyone who
   opens the page, so scope this one in ion.cesium.com -> Access
   Tokens (limit it to the assets you use and to your site URL).
   ============================================================ */

const CESIUM_ION_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJmYjU2ZGRhNy00YzFlLTRlNmItYjIyZC02NGVkZTE3NDVkNWEiLCJpZCI6NDUzNTM3LCJzdWIiOiJNYXR6dW5hZ2EiLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoiRjEgdGVzdGluZyAiLCJpYXQiOjE3ODM1MjA2OTd9.YKRKC1nre1fGJqU5NhdN6YFPVpMGzxW1sMuRrOY15yQ";

const MUNICH_CENTERLINE_URL = "https://raw.githubusercontent.com/TUMFTM/racetrack-database/master/tracks/Silverstone.csv";

// Rotation, shift, camera height and pitch are live number controls
// (type a value, tap -/+, or hold a button). The yellow line redraws in
// real time against the satellite imagery.
let ROTATION_OFFSET_DEG = 0;
const DISTANCE_BEHIND = 60;

// Camera height (meters above track) and pitch (degrees, 0 = level with
// horizon, -90 = straight down). playLap() reads these every frame.
let cameraHeightM = 150;
let cameraPitchDeg = -60;

// Zoom multiplier. playLap() forces the camera to an exact position every
// frame, so pinch-to-zoom gets overridden; this value is read inside that
// same per-frame update so zoom actually sticks during playback.
let zoomMultiplier = 1.0;

// Live position offset, in real meters east and north of the anchor.
// Fixes a translation error separately from rotation, which is a
// different kind of error.
let panEastM = 0;
let panNorthM = 0;

function rotateXY(dx, dy, angleDeg) {
  const rad = Cesium.Math.toRadians(angleDeg);
  return {
    x: dx * Math.cos(rad) - dy * Math.sin(rad),
    y: dx * Math.sin(rad) + dy * Math.cos(rad),
  };
}

const statusEl = document.getElementById("status");
function log(msg) {
  console.log(msg);
  statusEl.textContent = msg;
}

try {
  if (typeof Cesium === "undefined") {
    throw new Error("Cesium library never loaded — likely a slow or blocked connection to cdnjs.cloudflare.com. Try reloading, or switch networks (wifi vs cellular).");
  }
  Cesium.Ion.defaultAccessToken = CESIUM_ION_TOKEN;
} catch (err) {
  statusEl.textContent = "FAILED before setup: " + err.message;
  throw err;
}

let viewer;
let centerlineLatLon = [];  // track points in local meters, from Munich data
let carFrames = [];         // OpenF1 position samples, in arrival order
let trackPolylineEntity = null;

async function init() {
  log("Setting up Cesium viewer...");
  viewer = new Cesium.Viewer("cesiumContainer", {
    terrain: Cesium.Terrain.fromWorldTerrain(),
    baseLayerPicker: false,
    timeline: false,
    animation: false,
  });
  viewer.scene.primitives.add(await Cesium.createOsmBuildingsAsync());

  try {
    await Promise.all([loadMunichCenterline(), loadOpenF1Data()]);
    recomputeGeometry();

    log("Data loaded. Position samples: " + carFrames.length +
        " | Centerline points: " + centerlineLatLon.length +
        " | Ghost buffer laps: " + lapBuffers.length +
        "\nAdjust Rotation / Shift to match the track, tap Overview to check, or Play next lap.");

    document.getElementById("playBtn").onclick = () => playLap();
    document.getElementById("overviewBtn").onclick = () => showOverview();

    // Each control is a tap-to-type number input flanked by - / + buttons.
    // Sliders were nearly impossible to fine-tune with a fingertip on
    // iPhone. Type an exact value, tap once for a small nudge, or
    // press-and-hold a button to run through values quickly.
    const controls = {
      rot:  { min: -180,  max: 180,  onChange: v => { ROTATION_OFFSET_DEG = v; recomputeGeometry(); } },
      zoom: { min: 0.3,   max: 4.0,  onChange: v => { zoomMultiplier = v; } },
      panE: { min: -1000, max: 1000, onChange: v => { panEastM = v; recomputeGeometry(); } },
      panN: { min: -1000, max: 1000, onChange: v => { panNorthM = v; recomputeGeometry(); } },
      camH: { min: 5,     max: 500,  onChange: v => { cameraHeightM = v; } },
      camP: { min: -90,   max: -5,   onChange: v => { cameraPitchDeg = v; } },
    };
    const idFor = { rot: "rotVal", zoom: "zoomVal", panE: "panEVal", panN: "panNVal", camH: "camHVal", camP: "camPVal" };

    Object.keys(controls).forEach(ctl => {
      const { min, max, onChange } = controls[ctl];
      const input = document.getElementById(idFor[ctl]);
      const step = Number(input.step) || 1;

      const commit = (v) => {
        v = Math.max(min, Math.min(max, v));
        input.value = v;
        onChange(v);
      };
      // Typing a value directly (blur or Enter commits it).
      input.addEventListener("change", () => commit(Number(input.value) || 0));
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });

      // Tap = one step. Press-and-hold = repeats, speeding up after ~1.5s.
      document.querySelectorAll(`.stepBtn[data-ctl="${ctl}"]`).forEach(btn => {
        const dir = Number(btn.dataset.dir);
        let repeatTimer = null, holdTimeout = null, ticks = 0;
        const doStep = () => commit(Number(input.value) + dir * step);
        const startHold = () => {
          doStep();
          holdTimeout = setTimeout(() => {
            repeatTimer = setInterval(() => {
              ticks++;
              doStep();
              if (ticks === 15 && repeatTimer) {
                clearInterval(repeatTimer);
                repeatTimer = setInterval(doStep, 60);
              }
            }, 100);
          }, 400);
        };
        const stopHold = () => {
          clearTimeout(holdTimeout);
          clearInterval(repeatTimer);
          repeatTimer = null; ticks = 0;
        };
        btn.addEventListener("pointerdown", (e) => { e.preventDefault(); startHold(); });
        btn.addEventListener("pointerup", stopHold);
        btn.addEventListener("pointerleave", stopHold);
        btn.addEventListener("pointercancel", stopHold);
      });
    });
  } catch (err) {
    log("FAILED: " + err.message + "\n\nCheck the setup step at the top of this file.");
    console.error(err);
  }
}

// Flies straight above the whole track so the entire yellow polyline is
// visible against the satellite imagery in one shot.
function showOverview() {
  const sphere = Cesium.BoundingSphere.fromPoints(centerlineCartesians);
  viewer.camera.flyToBoundingSphere(sphere, {
    offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-90), sphere.radius * 2.5),
    duration: 1.5,
  });
}

// --- Step 1: real track geometry (Munich database) ---
// ANCHOR: Silverstone's real-world coordinates. Local file meters get
// placed against this real point.
const ANCHOR_LAT = 52.0717;
const ANCHOR_LON = -1.0159;
let centerlineCartesians = [];
let centerlineHeadings = [];  // per-point track heading, radians, for camera aim

async function loadMunichCenterline() {
  const res = await fetch(MUNICH_CENTERLINE_URL);
  if (!res.ok) throw new Error("Munich centerline fetch failed (" + res.status + ").");
  const text = await res.text();
  const lines = text.trim().split("\n").filter(l => !l.startsWith("#"));
  centerlineLatLon = lines.map(line => {
    const [x, y] = line.split(",").map(Number);
    return { x_m: x, y_m: y };
  });
}

// Rebuilds all rotation/shift-dependent geometry (track line, headings,
// car telemetry, ghost buffers). Called once at load, then live every
// time a control changes.
function recomputeGeometry() {
  const x0 = centerlineLatLon[0].x_m;
  const y0 = centerlineLatLon[0].y_m;
  const anchorCartesian = Cesium.Cartesian3.fromDegrees(ANCHOR_LON, ANCHOR_LAT, 0);
  const enuMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(anchorCartesian);

  centerlineCartesians = centerlineLatLon.map(pt => {
    const r = rotateXY(pt.x_m - x0, pt.y_m - y0, ROTATION_OFFSET_DEG);
    return Cesium.Matrix4.multiplyByPoint(enuMatrix, new Cesium.Cartesian3(r.x + panEastM, r.y + panNorthM, 0), new Cesium.Cartesian3());
  });

  centerlineHeadings = centerlineLatLon.map((pt, i) => {
    const next = centerlineLatLon[(i + 1) % centerlineLatLon.length];
    const r = rotateXY(next.x_m - pt.x_m, next.y_m - pt.y_m, ROTATION_OFFSET_DEG);
    return Math.atan2(r.x, r.y);
  });

  mapCarTelemetryToRealWorld();
  buildLapBuffers();

  if (trackPolylineEntity) viewer.entities.remove(trackPolylineEntity);
  trackPolylineEntity = viewer.entities.add({
    polyline: {
      positions: centerlineCartesians,
      width: 4,
      material: Cesium.Color.fromCssColorString("#E8FF00"),
      clampToGround: true,
    },
  });
}

// --- Step 2: real car telemetry (OpenF1) ---
let lapBoundaries = [];  // [{lap_number, date_start}], sorted, real lap-line crossings

async function loadOpenF1Data() {
  // 2026 Silverstone was a Sprint weekend: OpenF1 tags BOTH the Sprint
  // (Saturday) and the Grand Prix (Sunday) as session_type "Race".
  // Match on session_name so this resolves to the real race (key 11326).
  const sessRes = await fetch("https://api.openf1.org/v1/sessions?country_name=United Kingdom&year=2026&session_name=Race");
  const sessions = await sessRes.json();
  if (!sessions.length) throw new Error("No 2026 Great Britain Race session found in OpenF1 (checked session_name=Race).");
  const sessionKey = sessions[0].session_key;

  const drvRes = await fetch(`https://api.openf1.org/v1/drivers?session_key=${sessionKey}`);
  const drivers = await drvRes.json();
  if (!drivers.length) throw new Error("No drivers found for this session.");
  const driver = drivers[0];

  const locRes = await fetch(`https://api.openf1.org/v1/location?session_key=${sessionKey}&driver_number=${driver.driver_number}`);
  carFrames = await locRes.json();
  if (!carFrames.length) throw new Error("No location data returned for driver " + driver.driver_number + ".");

  // Real lap boundaries (start-of-lap timestamps), not a guessed slice
  // count, so lap breaks land on the actual start/finish line.
  const lapRes = await fetch(`https://api.openf1.org/v1/laps?session_key=${sessionKey}&driver_number=${driver.driver_number}`);
  const laps = await lapRes.json();
  lapBoundaries = laps
    .filter(l => l.date_start)
    .map(l => ({ lap_number: l.lap_number, date_start: new Date(l.date_start).getTime() }))
    .sort((a, b) => a.date_start - b.date_start);
  if (!lapBoundaries.length) throw new Error("No lap boundary data returned — can't slice laps accurately.");
}

// --- Step 3: GHOST BUFFER ---
const SAMPLES_PER_LAP = 300;
const MAX_GHOSTS = 4;

let carCartesiansAll = [];
let lapBuffers = [];
let currentLapIndex = 0;
let ghostEntities = [];
let liveCarEntity = null;
let REAL_LAP_COUNT_V0 = 0;  // set from real lap boundary data, not guessed

function mapCarTelemetryToRealWorld() {
  const x0 = carFrames[0].x;
  const y0 = carFrames[0].y;
  const anchorCartesian = Cesium.Cartesian3.fromDegrees(ANCHOR_LON, ANCHOR_LAT, 0);
  const enuMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(anchorCartesian);
  carCartesiansAll = carFrames.map(f => {
    const r = rotateXY(f.x - x0, f.y - y0, ROTATION_OFFSET_DEG);
    return Cesium.Matrix4.multiplyByPoint(enuMatrix, new Cesium.Cartesian3(r.x + panEastM, r.y + panNorthM, 0), new Cesium.Cartesian3());
  });
}

// Slices carCartesiansAll on real lap-start timestamps from the OpenF1
// /laps endpoint instead of dividing the sample array into guessed chunks.
function buildLapBuffers() {
  const frameTimes = carFrames.map(f => new Date(f.date).getTime());
  lapBuffers = [];
  for (let lap = 0; lap < lapBoundaries.length; lap++) {
    const startT = lapBoundaries[lap].date_start;
    const endT = lap + 1 < lapBoundaries.length ? lapBoundaries[lap + 1].date_start : Infinity;
    let startIdx = frameTimes.findIndex(t => t >= startT);
    if (startIdx === -1) continue;
    let endIdx = frameTimes.findIndex(t => t >= endT);
    if (endIdx === -1) endIdx = frameTimes.length;
    const chunk = carCartesiansAll.slice(startIdx, endIdx);
    if (chunk.length < 2) continue;
    lapBuffers.push(resampleToFixedSteps(chunk, SAMPLES_PER_LAP));
  }
  REAL_LAP_COUNT_V0 = lapBuffers.length;
}

function resampleToFixedSteps(points, steps) {
  if (points.length < 2) {
    const fallback = points[0] || Cesium.Cartesian3.ZERO;
    return new Array(steps).fill(fallback);
  }
  const out = [];
  for (let i = 0; i < steps; i++) {
    const t = (i / (steps - 1)) * (points.length - 1);
    const i0 = Math.floor(t);
    const i1 = Math.min(i0 + 1, points.length - 1);
    const frac = t - i0;
    out.push(Cesium.Cartesian3.lerp(points[i0], points[i1], frac, new Cesium.Cartesian3()));
  }
  return out;
}

function clearGhostEntities() {
  ghostEntities.forEach(e => viewer.entities.remove(e));
  ghostEntities = [];
  if (liveCarEntity) {
    viewer.entities.remove(liveCarEntity);
    liveCarEntity = null;
  }
}

// --- Step 4: playback — camera flythrough + live car + ghost laps ---
let activePlaybackInterval = null;

function playLap() {
  if (!centerlineCartesians.length || !lapBuffers.length) { log("Data not ready — can't play."); return; }

  // Kill any prior playback loop so two intervals never fight over the camera.
  if (activePlaybackInterval !== null) {
    clearInterval(activePlaybackInterval);
    activePlaybackInterval = null;
  }
  // Cancel any in-flight Overview fly so it can't stomp the POV camera.
  viewer.camera.cancelFlight();

  clearGhostEntities();

  const ghostLapIndices = [];
  for (let g = currentLapIndex - 1; g >= 0 && ghostLapIndices.length < MAX_GHOSTS; g--) {
    ghostLapIndices.push(g);
  }

  ghostEntities = ghostLapIndices.map((lapIdx, order) => {
    const age = order + 1;
    return viewer.entities.add({
      point: {
        pixelSize: 10,
        color: Cesium.Color.fromCssColorString("#E8FF00").withAlpha(Math.max(0.15, 1 - age * 0.22)),
      },
      position: lapBuffers[lapIdx][0],
    });
  });

  liveCarEntity = viewer.entities.add({
    point: { pixelSize: 14, color: Cesium.Color.fromCssColorString("#FF3C3C") },
    position: centerlineCartesians[0],
  });

  const total = centerlineCartesians.length;
  let i = 0;
  log("Playing lap " + (currentLapIndex + 1) + " of " + REAL_LAP_COUNT_V0 +
      " — " + ghostLapIndices.length + " ghost(s) trailing.");

  activePlaybackInterval = setInterval(() => {
    if (i >= total) {
      clearInterval(activePlaybackInterval);
      activePlaybackInterval = null;
      currentLapIndex = (currentLapIndex + 1) % REAL_LAP_COUNT_V0;
      log("Lap complete. Press Play next lap to continue — " +
          Math.min(currentLapIndex, MAX_GHOSTS) + " ghost(s) will trail next time.");
      return;
    }
    const pos = centerlineCartesians[i];
    const nextPos = centerlineCartesians[(i + 1) % total];

    const forward = Cesium.Cartesian3.normalize(
      Cesium.Cartesian3.subtract(nextPos, pos, new Cesium.Cartesian3()),
      new Cesium.Cartesian3()
    );
    const groundNormal = Cesium.Cartesian3.normalize(pos, new Cesium.Cartesian3());
    const cameraPos = Cesium.Cartesian3.add(
      Cesium.Cartesian3.add(
        pos,
        Cesium.Cartesian3.multiplyByScalar(forward, -DISTANCE_BEHIND * zoomMultiplier, new Cesium.Cartesian3()),
        new Cesium.Cartesian3()
      ),
      Cesium.Cartesian3.multiplyByScalar(groundNormal, cameraHeightM * zoomMultiplier, new Cesium.Cartesian3()),
      new Cesium.Cartesian3()
    );
    viewer.camera.setView({
      destination: cameraPos,
      orientation: {
        heading: centerlineHeadings[i],
        pitch: Cesium.Math.toRadians(cameraPitchDeg),
        roll: 0,
      },
    });

    liveCarEntity.position = pos;

    const progressFrac = i / (total - 1);
    ghostEntities.forEach((entity, idx) => {
      const buf = lapBuffers[ghostLapIndices[idx]];
      const gi = Math.min(Math.round(progressFrac * (buf.length - 1)), buf.length - 1);
      entity.position = buf[gi];
    });

    i += 1;
  }, 50);
}

init();
</script>
</body>
</html>
