const mean2 = pts => { let x = 0, y = 0; pts.forEach(p => { x += p[0]; y += p[1]; }); return [x / pts.length, y / pts.length]; };
const rot2 = (p, th) => [p[0] * Math.cos(th) - p[1] * Math.sin(th), p[0] * Math.sin(th) + p[1] * Math.cos(th)];

function decodeTrack(enc) {
  let a = 0, b = 0;
  const pts = enc.split(" ").map(s => {
    const [x, y] = s.split(".");
    a += parseInt(x, 36); b += parseInt(y, 36);
    return toEN(a / 1e6, b / 1e6);
  });
  const f = pts[0], l = pts[pts.length - 1];
  if (Math.hypot(f[0] - l[0], f[1] - l[1]) < 0.5) pts.pop();   // stored closed; drop the duplicate
  return pts;
}

function resampleClosed(pts, step) {
  const p = pts.concat([pts[0]]);
  const cum = [0];
  for (let i = 1; i < p.length; i++) cum.push(cum[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
  const L = cum[cum.length - 1], N = Math.round(L / step), out = [];
  let j = 0;
  for (let k = 0; k < N; k++) {
    const s = L * k / N;
    while (j < cum.length - 2 && cum[j + 1] < s) j++;
    const f = (s - cum[j]) / ((cum[j + 1] - cum[j]) || 1);
    out.push([p[j][0] + (p[j + 1][0] - p[j][0]) * f, p[j][1] + (p[j + 1][1] - p[j][1]) * f]);
  }
  return { pts: out, length: L };
}

function resampleOpen(pts, n) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const L = cum[cum.length - 1], out = [];
  let j = 0;
  for (let k = 0; k < n; k++) {
    const s = L * k / (n - 1);
    while (j < cum.length - 2 && cum[j + 1] < s) j++;
    const f = (s - cum[j]) / ((cum[j + 1] - cum[j]) || 1);
    out.push([pts[j][0] + (pts[j + 1][0] - pts[j][0]) * f, pts[j][1] + (pts[j + 1][1] - pts[j][1]) * f]);
  }
  return out;
}

function nearestIdx(q, pts) {
  let best = 1e18, bi = 0;
  for (let i = 0; i < pts.length; i++) {
    const dx = pts[i][0] - q[0], dy = pts[i][1] - q[1], d = dx * dx + dy * dy;
    if (d < best) { best = d; bi = i; }
  }
  return { idx: bi, dist: Math.sqrt(best) };
}

  const ct = mean2(trackDense);

    const Q = P.map(p => [p[0], p[1] * refl]);
    const cq = mean2(Q);
    for (let deg = 0; deg < 360; deg += 5) {
      const th = deg * Math.PI / 180;
      let s = 0;
      for (let i = 0; i < Q.length; i++) {
        const r = rot2([Q[i][0] - cq[0], Q[i][1] - cq[1]], th);
        s += nearestIdx([r[0] + ct[0], r[1] + ct[1]], trackDense).dist;
      }
      const err = s / Q.length;
      if (err < best.err) {
        const rc = rot2(cq, th);
        best = { err, refl, th, t: [ct[0] - rc[0], ct[1] - rc[1]] };
      }
    }
  }
  const apply = (f, p) => { const r = rot2([p[0], p[1] * f.refl], f.th); return [r[0] + f.t[0], r[1] + f.t[1]]; };
  for (let it = 0; it < 40; it++) {
    const cur = P.map(p => apply(best, p));
    const tgt = cur.map(c => trackDense[nearestIdx(c, trackDense).idx]);
    const mp = mean2(cur), mt = mean2(tgt);
    let sd = 0, sc = 0;
    for (let i = 0; i < cur.length; i++) {
      const a = [cur[i][0] - mp[0], cur[i][1] - mp[1]], b = [tgt[i][0] - mt[0], tgt[i][1] - mt[1]];
      sd += a[0] * b[0] + a[1] * b[1]; sc += a[0] * b[1] - a[1] * b[0];
    }
    const dth = Math.atan2(sc, sd);
    const rt = rot2([best.t[0] - mp[0], best.t[1] - mp[1]], dth);
    best = { ...best, th: best.th + dth, t: [rt[0] + mt[0], rt[1] + mt[1]] };
  }
  const d = P.map(p => nearestIdx(apply(best, p), trackDense).dist).sort((a, b) => a - b);
  best.meanErr = d.reduce((a, b) => a + b, 0) / d.length;
  best.p90 = d[Math.floor(d.length * 0.9)];
  best.apply = p => apply(best, p);
  return best;
}

const frameToEN = f => fit.apply([f.x / 10, f.y / 10]);

function lapFrameRange(frameTimes, lap) {
  const startT = lapBoundaries[lap].date_start;
  const endT = lap + 1 < lapBoundaries.length ? lapBoundaries[lap + 1].date_start : Infinity;
  const s = frameTimes.findIndex(t => t >= startT);
  if (s === -1) return null;
  let e = frameTimes.findIndex(t => t >= endT);
  if (e === -1) e = frameTimes.length;
  return [s, e];
}

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  log("Setting up Cesium viewer...");
  terrainProvider = await Cesium.createWorldTerrainAsync();
  viewer = new Cesium.Viewer("cesiumContainer", {
    terrainProvider,
    baseLayerPicker: false,
    timeline: false,
    animation: false,
  });
  osmBuildings = await Cesium.createOsmBuildingsAsync();
  viewer.scene.primitives.add(osmBuildings);

  setupPanel();
  resizeHud();
  window.addEventListener("resize", resizeHud);
  if (document.fonts && document.fonts.load) document.fonts.load("700 20px Rajdhani").then(() => drawHud(lastHudState));

  try {
    log("Finding races...");
    await loadSessionList();
    const def = sessions.find(s => s.session_key === 11326) || sessions[0];
    if (!def) throw new Error("No races found for the circuits in the library.");
    document.getElementById("raceSel").value = def.session_key;
    await loadAll(def.session_key, null);
  } catch (err) {
    log("FAILED: " + err.message);
    console.error(err);
  }
}

async function loadSessionList() {
  const supported = new Set(TRACKS.flatMap(t => t.circuits));
  const all = [];
  for (const y of RACE_YEARS) {
    try {
      const r = await jget(`${OPENF1}/sessions?session_name=Race&year=${y}`);
      if (Array.isArray(r)) r.forEach(s => { if (supported.has(s.circuit_short_name)) all.push(s); });
    } catch (e) { console.warn("sessions fetch failed for", y, e); }
  }
  all.sort((a, b) => new Date(b.date_start) - new Date(a.date_start));
  sessions = all;
  const sel = document.getElementById("raceSel");
  sel.innerHTML = "";
  all.forEach(s => {
    const o = document.createElement("option");
    o.value = s.session_key;
    o.textContent = s.year + " " + s.circuit_short_name;
    sel.appendChild(o);
  });
}

/* Build (once per circuit) the track at 5 m spacing, plus terrain heights under it. */
async function ensureTrackBase(track) {
  if (track.base) return track.base;
  setAnchor(track.anchor[0], track.anchor[1]);
  const loop = resampleClosed(decodeTrack(track.enc), TRACK_STEP_M);
  const dense = resampleClosed(loop.pts, 2).pts;
  const cartos = loop.pts.map(p => { const g = fromEN(p[0], p[1]); return Cesium.Cartographic.fromDegrees(g.lon, g.lat); });
  let heights = cartos.map(() => 0), terrainOk = true;
  try {
    const sampled = await Cesium.sampleTerrainMostDetailed(terrainProvider, cartos);
    heights = sampled.map(c => (typeof c.height === "number" && isFinite(c.height)) ? c.height : 0);
  } catch (e) { terrainOk = false; console.warn("Terrain sampling failed, using height 0:", e); }
  track.base = { EN: loop.pts, dense, length: loop.length, heights, terrainOk };
  return track.base;
}

/* ============================================================
   LOAD A RACE + DRIVER
   ============================================================ */
async function loadAll(sessionKey, driverNumber) {
  const tok = ++loadToken;
  stopPlayback();
  const sess = sessions.find(s => s.session_key == sessionKey);
  const track = TRACKS.find(t => t.circuits.includes(sess.circuit_short_name));
  const trackChanged = track !== curTrack;

  log("Loading " + sess.year + " " + sess.circuit_short_name + "...");
  setAnchor(track.anchor[0], track.anchor[1]);
  const base = await ensureTrackBase(track);
  if (tok !== loadToken) return;

  if (sessionKey != curSessionKey || !drivers.length) {
    const d = await jget(`${OPENF1}/drivers?session_key=${sessionKey}`);
    if (!Array.isArray(d) || !d.length) throw new Error("No drivers found for this session.");
    drivers = d.sort((a, b) => a.driver_number - b.driver_number);
    const dsel = document.getElementById("driverSel");
    dsel.innerHTML = "";
    drivers.forEach(x => {
      const o = document.createElement("option");
      o.value = x.driver_number;
      o.textContent = (x.name_acronym || "") + " " + x.driver_number + " " + (x.full_name || "");
      dsel.appendChild(o);
    });
    if (driverNumber == null) driverNumber = (curDriver && drivers.find(x => x.driver_number == curDriver.driver_number)) ? curDriver.driver_number : drivers[0].driver_number;
  }
  const drv = drivers.find(x => x.driver_number == driverNumber) || drivers[0];
  document.getElementById("driverSel").value = drv.driver_number;
  curSessionKey = sessionKey;

  log("Loading telemetry for " + (drv.full_name || drv.driver_number) + "...");
  const dn = drv.driver_number;
  const loc = await jget(`${OPENF1}/location?session_key=${sessionKey}&driver_number=${dn}`);
  const [laps, st, pos] = await Promise.all([
    jget(`${OPENF1}/laps?session_key=${sessionKey}&driver_number=${dn}`),
    jget(`${OPENF1}/stints?session_key=${sessionKey}&driver_number=${dn}`).catch(() => []),
    jget(`${OPENF1}/position?session_key=${sessionKey}&driver_number=${dn}`).catch(() => []),
  ]);
  if (tok !== loadToken) return;
  if (!Array.isArray(loc) || !loc.length) throw new Error("No location data returned for driver " + dn + ".");
  carFrames = loc;
  lapBoundaries = (Array.isArray(laps) ? laps : [])
    .filter(l => l.date_start)
    .map(l => ({
      lap_number: l.lap_number, date_start: new Date(l.date_start).getTime(), lap_duration: l.lap_duration,
      pit_out: !!l.is_pit_out_lap, s1: l.duration_sector_1, s2: l.duration_sector_2, s3: l.duration_sector_3,
    }))
    .sort((a, b) => a.date_start - b.date_start);
  if (!lapBoundaries.length) throw new Error("No lap data returned for driver " + dn + ".");
  stints = Array.isArray(st) ? st : [];
  positions = (Array.isArray(pos) ? pos : []).map(p => ({ t: new Date(p.date).getTime(), pos: p.position })).sort((a, b) => a.t - b.t);
  carCache = new Map();

  log("Fitting telemetry to the track...");
  await new Promise(r => setTimeout(r, 30));   // let the status paint before the heavy part

  /* fit telemetry to the real track, using the fastest clean lap */
  const frameTimes = carFrames.map(f => new Date(f.date).getTime());
  let fitLap = -1, bestDur = Infinity;
  lapBoundaries.forEach((lb, i) => { if (lb.lap_duration > 0 && !lb.pit_out && lb.lap_duration < bestDur && lapFrameRange(frameTimes, i)) { bestDur = lb.lap_duration; fitLap = i; } });
  if (fitLap < 0) fitLap = lapBoundaries.findIndex((_, i) => lapFrameRange(frameTimes, i));
  const rng = lapFrameRange(frameTimes, fitLap);
  fit = fitTelemetryToTrack(base.dense, carFrames.slice(rng[0], rng[1]).map(f => [f.x / 10, f.y / 10]));

  /* start/finish: where the real lap-start timestamps sit on the track */
  const N = base.EN.length, starts = [];
  for (let lap = 1; lap < lapBoundaries.length; lap++) {
    const r = lapFrameRange(frameTimes, lap);
    if (r) starts.push(nearestIdx(fit.apply([carFrames[r[0]].x / 10, carFrames[r[0]].y / 10]), base.EN).idx);
  }
  let startIdx = 0;
  if (starts.length) {
    let off = 0;
    starts.forEach(s => { let d = s - starts[0]; if (d > N / 2) d -= N; if (d < -N / 2) d += N; off += d; });
    startIdx = ((starts[0] + Math.round(off / starts.length)) % N + N) % N;
  }
  trackEN = base.EN.slice(startIdx).concat(base.EN.slice(0, startIdx));
  trackHeights = base.heights.slice(startIdx).concat(base.heights.slice(0, startIdx));
  trackLengthM = base.length;
  trackStepM = trackLengthM / N;

  buildTrackGeometry(track);
  computeLapProgress();
  currentLapIndex = fastestLapIndex;
  curSession = sess; curTrack = track; curDriver = drv;

  /* buildings that sit on this circuit's track */
  const expr = track.hiddenBuildings.map(id => "Number(${elementId}) !== " + id).join(" && ");
  osmBuildings.style = new Cesium.Cesium3DTileStyle({ show: expr || "true" });

  buildLapSelect();
  buildMiniMap();
  prefetchLap(currentLapIndex);
  lastHudState = null;
  drawHud(null);

  log(sess.year + " " + sess.circuit_short_name + " — " + (drv.full_name || drv.driver_number) +
      "\nTrack " + (trackLengthM / 1000).toFixed(2) + " km from OpenStreetMap | fit mean " + fit.meanErr.toFixed(1) +
      " m, 90% within " + fit.p90.toFixed(1) + " m | " + REAL_LAP_COUNT_V0 + " laps\nPress Play lap.");
  if (trackChanged) showOverview();
}

function buildLapSelect() {
  const sel = document.getElementById("lapSel");
  sel.innerHTML = "";
  lapBoundaries.forEach((lb, i) => {
    if (!lapProgress[i]) return;
    const o = document.createElement("option");
    o.value = i;
    o.textContent = "Lap " + lb.lap_number + (lb.lap_duration ? "  " + fmtLap(lb.lap_duration * 1000) : "") + (i === fastestLapIndex ? "  fastest" : "") + (lb.pit_out ? "  out" : "");
    sel.appendChild(o);
  });
  sel.value = currentLapIndex;
}

function showOverview() {
  if (!trackCart.length) return;
  const sphere = Cesium.BoundingSphere.fromPoints(trackCart);
  viewer.camera.flyToBoundingSphere(sphere, {
    offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-90), sphere.radius * 2.5),
    duration: 1.5,
  });
}

/* Cartesian track points on the real ground, the clamped yellow line, the start/finish marker. */
function buildTrackGeometry(track) {
  trackCart = trackEN.map((p, i) => { const g = fromEN(p[0], p[1]); return Cesium.Cartesian3.fromDegrees(g.lon, g.lat, trackHeights[i] + CAR_LIFT_M); });
  trackGroundCart = trackEN.map(p => { const g = fromEN(p[0], p[1]); return Cesium.Cartesian3.fromDegrees(g.lon, g.lat, 0); });
  const N = trackEN.length, AHEAD = 3;
  trackHeadings = trackEN.map((p, i) => {
    const q = trackEN[(i + AHEAD) % N];
    return Math.atan2(q[0] - p[0], q[1] - p[1]);
  });
  if (trackPolylineEntity) viewer.entities.remove(trackPolylineEntity);
  trackPolylineEntity = viewer.entities.add({
    polyline: {
      positions: trackGroundCart.concat([trackGroundCart[0]]),   // closed loop
      width: 4,
      material: Cesium.Color.fromCssColorString("#E8FF00"),
      clampToGround: true,
    },
  });
  if (startFinishEntity) viewer.entities.remove(startFinishEntity);
  startFinishEntity = viewer.entities.add({
    position: trackCart[0],
    point: { pixelSize: 12, color: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK, outlineWidth: 2 },
    label: { text: "START / FINISH", font: "12px monospace", fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK,
             outlineWidth: 3, style: Cesium.LabelStyle.FILL_AND_OUTLINE, pixelOffset: new Cesium.Cartesian2(0, -18) },
  });
}

/* ============================================================
   REAL-TIME LAP PLAYBACK
   Each real lap becomes a table of (time since the lap started, distance
   along the track). Playback runs on the wall clock, so a lap takes its
   true lap time and the camera speeds up and slows down as the car did.
   ============================================================ */
function trackProgressFor(frames, startT) {
  const N = trackEN.length;
  const T = new Float64Array(frames.length), S = new Float64Array(frames.length);
  const segFrac = (p, i0) => {
    const a = trackEN[((i0 % N) + N) % N], b = trackEN[(((i0 + 1) % N) + N) % N];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const tt = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
    return { t: tt, d: Math.hypot(p[0] - (a[0] + dx * tt), p[1] - (a[1] + dy * tt)) };
  };
  let prevIdx = -1, cont = 0;
  for (let k = 0; k < frames.length; k++) {
    const p = frameToEN(frames[k]);
    let best = 1e18, bi = 0;
    const scan = (from, to) => {
      for (let d = from; d <= to; d++) {
        const i = prevIdx < 0 ? d : (((prevIdx + d) % N) + N) % N;
        const dx = trackEN[i][0] - p[0], dy = trackEN[i][1] - p[1], q = dx * dx + dy * dy;
        if (q < best) { best = q; bi = i; }
      }
    };
    if (prevIdx < 0) scan(0, N - 1); else { scan(-8, 60); if (Math.sqrt(best) > 40) { prevIdx = -1; best = 1e18; scan(0, N - 1); } }
    const s1 = segFrac(p, bi), s0 = segFrac(p, bi - 1);
    const frac = s0.d < s1.d ? (bi - 1 + s0.t) : (bi + s1.t);
    if (k === 0) { cont = frac > N / 2 ? frac - N : frac; }
    else {
      const base = ((cont % N) + N) % N;
      let delta = frac - base;
      if (delta > N / 2) delta -= N; if (delta < -N / 2) delta += N;
      cont = Math.max(cont, cont + delta);   // the car never goes backwards
    }
    prevIdx = bi;
    T[k] = new Date(frames[k].date).getTime() - startT;
    S[k] = cont;
  }
  return { t: T, s: S };
}

function computeLapProgress() {
  const frameTimes = carFrames.map(f => new Date(f.date).getTime());
  lapProgress = lapBoundaries.map((lb, lap) => {
    const r = lapFrameRange(frameTimes, lap);
    if (!r || r[1] - r[0] < 10) return null;
    const lp = trackProgressFor(carFrames.slice(r[0], r[1]), lb.date_start);
    const endT = lap + 1 < lapBoundaries.length ? lapBoundaries[lap + 1].date_start : null;
    lp.dur = endT ? endT - lb.date_start : lp.t[lp.t.length - 1];
    return lp;
  });
  REAL_LAP_COUNT_V0 = lapProgress.filter(Boolean).length;
  let bestDur = Infinity;
  fastestLapIndex = Math.max(0, lapProgress.findIndex(Boolean));
  lapBoundaries.forEach((lb, i) => {
    if (lapProgress[i] && lb.lap_duration > 0 && !lb.pit_out && lb.lap_duration < bestDur) { bestDur = lb.lap_duration; fastestLapIndex = i; }
  });
}

function progressAt(lp, tms) {
  const T = lp.t, S = lp.s, n = T.length;
  if (tms <= T[0]) return S[0];
  if (tms >= T[n - 1]) return S[n - 1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (T[mid] <= tms) lo = mid; else hi = mid; }
  return S[lo] + (S[hi] - S[lo]) * ((tms - T[lo]) / ((T[hi] - T[lo]) || 1));
}

/* time (ms since lap start) at which a lap reached track progress s, or null */
function timeAtProgress(lp, s) {
  const T = lp.t, S = lp.s, n = T.length;
  if (s < S[0] || s > S[n - 1]) return null;
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (S[mid] <= s) lo = mid; else hi = mid; }
  return T[lo] + (T[hi] - T[lo]) * ((s - S[lo]) / ((S[hi] - S[lo]) || 1));
}

function trackPointAt(arr, s) {
  const N = arr.length, fl = Math.floor(s), f = s - fl;
  return Cesium.Cartesian3.lerp(arr[((fl % N) + N) % N], arr[(((fl + 1) % N) + N) % N], f, new Cesium.Cartesian3());
}

function headingAt(s) {
  const N = trackHeadings.length, fl = Math.floor(s), f = s - fl;
  const a = trackHeadings[((fl % N) + N) % N], b = trackHeadings[(((fl + 1) % N) + N) % N];
  const d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  return a + d * f;
}

const fmtLap = ms => { const s = ms / 1000, m = Math.floor(s / 60); return m + ":" + (s - m * 60).toFixed(3).padStart(6, "0"); };
const isoNoZ = ms => new Date(ms).toISOString().replace("Z", "");

/* ---------------- car data (speed, rpm, gear, throttle, brake, DRS) for one lap ---------------- */
function getLapCar(lapIdx) {
  const key = lapIdx;
  if (carCache.has(key)) return carCache.get(key);
  const lb = lapBoundaries[lapIdx], lp = lapProgress[lapIdx];
  const a = isoNoZ(lb.date_start - 600), b = isoNoZ(lb.date_start + lp.dur + 600);
  const sk = curSessionKey, dn = curDriver.driver_number;
  const p = jget(`${OPENF1}/car_data?session_key=${sk}&driver_number=${dn}&date>${a}&date<${b}`)
    .then(rows => {
      if (!Array.isArray(rows) || !rows.length) throw new Error("no car data");
      rows.sort((x, y) => new Date(x.date) - new Date(y.date));
      return {
        t: rows.map(r => new Date(r.date).getTime() - lb.date_start),
        speed: rows.map(r => r.speed), rpm: rows.map(r => r.rpm), gear: rows.map(r => r.n_gear),
        thr: rows.map(r => r.throttle), brk: rows.map(r => r.brake), drs: rows.map(r => r.drs),
      };
    });
  carCache.set(key, p);
  p.catch(() => carCache.delete(key));
  return p;
}
function prefetchLap(i) { if (lapProgress[i]) getLapCar(i).catch(() => {}); }

function carAt(car, el) {
  const T = car.t, n = T.length;
  let lo = 0, hi = n - 1;
  if (el <= T[0]) hi = lo = 0; else if (el >= T[n - 1]) lo = hi = n - 1;
  else while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (T[mid] <= el) lo = mid; else hi = mid; }
  const f = hi === lo ? 0 : (el - T[lo]) / (T[hi] - T[lo]);
  const mix = a => a[lo] + (a[hi] - a[lo]) * f;
  return { speed: mix(car.speed), rpm: mix(car.rpm), thr: mix(car.thr), gear: car.gear[lo], brk: car.brk[lo], drs: car.drs[lo] };
}

/* ---------------- playback ---------------- */
function clearGhostEntities() {
  ghostEntities.forEach(e => viewer.entities.remove(e));
  ghostEntities = [];
}
function stopPlayback() {
  playToken++;
  if (activePlaybackInterval !== null) { clearInterval(activePlaybackInterval); activePlaybackInterval = null; }
  if (viewer) clearGhostEntities();
  lastHudState = null;
  drawHud(null);
}

function referenceLapFor(idx) {
  let best = -1, bd = Infinity;
  lapBoundaries.forEach((lb, i) => { if (i !== idx && lapProgress[i] && lb.lap_duration > 0 && !lb.pit_out && lb.lap_duration < bd) { bd = lb.lap_duration; best = i; } });
  return best;
}

async function playLap() {
  if (!trackCart.length || !REAL_LAP_COUNT_V0) { log("Data not ready — can't play."); return; }
  if (activePlaybackInterval !== null) { clearInterval(activePlaybackInterval); activePlaybackInterval = null; }
  viewer.camera.cancelFlight();
  clearGhostEntities();
  const tok = ++playToken;

  const sel = document.getElementById("lapSel");
  let lapIdx = Number(sel.value);
  if (!lapProgress[lapIdx]) lapIdx = fastestLapIndex;
  currentLapIndex = lapIdx;
  const lp = lapProgress[lapIdx], lb = lapBoundaries[lapIdx];
  const lapNo = lb.lap_number;

  log("Loading car data for lap " + lapNo + "...");
  let car = null;
  try { car = await getLapCar(lapIdx); } catch (e) { console.warn("car data unavailable:", e); }
  if (tok !== playToken) return;

  const ghostLapIndices = [];
  for (let g = lapIdx - 1; g >= 0 && ghostLapIndices.length < MAX_GHOSTS; g--) if (lapProgress[g]) ghostLapIndices.push(g);
  ghostEntities = ghostLapIndices.map((gi, order) => viewer.entities.add({
    point: {
      pixelSize: 10,
      color: Cesium.Color.fromCssColorString("#E8FF00").withAlpha(Math.max(0.15, 1 - (order + 1) * 0.22)),
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
    },
    position: trackGroundCart[0],
  }));

  const refIdx = referenceLapFor(lapIdx);
  const refLp = refIdx >= 0 ? lapProgress[refIdx] : null;
  const stint = stints.find(s => s.lap_start <= lapNo && (s.lap_end == null || lapNo <= s.lap_end));
  const N = trackCart.length;
  statusEl.style.display = "none";

  const wallStart = performance.now();
  activePlaybackInterval = setInterval(() => {
    const el = performance.now() - wallStart;
    if (el >= lp.dur) {
      clearInterval(activePlaybackInterval);
      activePlaybackInterval = null;
      const next = lapProgress.findIndex((x, i) => i > lapIdx && x);
      currentLapIndex = next >= 0 ? next : fastestLapIndex;
      document.getElementById("lapSel").value = currentLapIndex;
      prefetchLap(currentLapIndex);
      log("Lap " + lapNo + " complete in " + fmtLap(lp.dur) + ".\nPress Play lap for lap " + lapBoundaries[currentLapIndex].lap_number + ", or pick another lap.");
      return;
    }
    const s = progressAt(lp, el);
    const pos = trackPointAt(trackCart, s);
    const ahead = trackPointAt(trackCart, s + 3);

    const forward = Cesium.Cartesian3.normalize(Cesium.Cartesian3.subtract(ahead, pos, new Cesium.Cartesian3()), new Cesium.Cartesian3());
    const up = Cesium.Cartesian3.normalize(pos, new Cesium.Cartesian3());
    const cameraPos = Cesium.Cartesian3.add(
      Cesium.Cartesian3.add(pos, Cesium.Cartesian3.multiplyByScalar(forward, -cameraBackM * zoomMultiplier, new Cesium.Cartesian3()), new Cesium.Cartesian3()),
      Cesium.Cartesian3.multiplyByScalar(up, cameraHeightM * zoomMultiplier, new Cesium.Cartesian3()),
      new Cesium.Cartesian3()
    );
    viewer.camera.setView({
      destination: cameraPos,
      orientation: { heading: headingAt(s), pitch: Cesium.Math.toRadians(cameraPitchDeg), roll: 0 },
    });

    const ghostS = ghostEntities.map((entity, idx) => {
      const gs = progressAt(lapProgress[ghostLapIndices[idx]], el);
      entity.position = trackPointAt(trackGroundCart, gs);
      return gs;
    });

    /* HUD */
    const c = car ? carAt(car, el) : null;
    let delta = null;
    if (refLp) { const tr = timeAtProgress(refLp, s); if (tr != null) delta = (el - tr) / 1000; }
    const absT = lb.date_start + el;
    let posNow = null;
    for (let i = 0; i < positions.length; i++) { if (positions[i].t <= absT) posNow = positions[i].pos; else break; }
    if (posNow == null && positions.length) posNow = positions[0].pos;
    const st = {
      live: true, speed: c ? c.speed : null, rpm: c ? c.rpm : null, gear: c ? c.gear : null, thr: c ? c.thr : null,
      brk: c ? c.brk : null, drs: c ? c.drs : null, el, dur: lp.dur, lapNo,
      prog: Math.max(0, Math.min(1, s / N)), sCur: s, ghostS,
      sect: [lb.s1, lb.s2, lb.s3], pos: posNow,
      tire: stint ? stint.compound : null, tireAge: stint ? (stint.tyre_age_at_start || 0) + (lapNo - stint.lap_start) : null,
      delta, refLapNo: refIdx >= 0 ? lapBoundaries[refIdx].lap_number : null,
    };
    lastHudState = st;
    drawHud(st);
    window.__playState = { lapNo, el, s, speed: st.speed, gear: st.gear, delta };
  }, 33);
}

/* ============================================================
   HUD (canvas overlay): speed dial, revs and gear, throttle and brake,
   lap clock, sectors, delta, position, tire, mini map, lap progress.
   Palette: black 0D0D0D, electric yellow E8FF00, off-white F0EDE6,
   charcoal 3D3D3D, signal red FF3C3C. Type: Rajdhani (numbers, labels).
   ============================================================ */
const hud = document.getElementById("hud"), hx = hud.getContext("2d");
let hudOn = true, hudK = 1, HW = 0, HH = 0, lastHudState = null;
let mapInfo = null;
const C = { yellow: "#E8FF00", white: "#F0EDE6", red: "#FF3C3C", black: "#0D0D0D", char: "#3D3D3D" };

function resizeHud() {
  const dpr = window.devicePixelRatio || 1;
  HW = window.innerWidth; HH = window.innerHeight;
  hud.width = Math.round(HW * dpr); hud.height = Math.round(HH * dpr);
  hud.style.width = HW + "px"; hud.style.height = HH + "px";
  hx.setTransform(dpr, 0, 0, dpr, 0, 0);
  hudK = Math.min(HH / 720, HW / 1100);
  drawHud(lastHudState);
}

function buildMiniMap() {
  let minE = 1e18, maxE = -1e18, minN = 1e18, maxN = -1e18;
  trackEN.forEach(p => { minE = Math.min(minE, p[0]); maxE = Math.max(maxE, p[0]); minN = Math.min(minN, p[1]); maxN = Math.max(maxN, p[1]); });
  mapInfo = { minE, maxE, minN, maxN };
}

const hudFont = (w, px) => w + " " + (px * hudK).toFixed(1) + "px Rajdhani, 'Arial Narrow', sans-serif";
function hText(str, x, y, px, weight, color, align) {
  hx.font = hudFont(weight || 700, px);
  hx.fillStyle = color || C.white;
  hx.textAlign = align || "center";
  hx.textBaseline = "middle";
  hx.fillText(str, x, y);
}

const GA0 = 0.75 * Math.PI, GSW = 1.5 * Math.PI;      // gauges: start at 135 degrees, sweep 270 degrees
const gAng = f => GA0 + GSW * f;
function gArc(cx, cy, r, f0, f1, color, lw) {
  if (f1 <= f0) return;
  hx.beginPath(); hx.arc(cx, cy, r, gAng(f0), gAng(f1));
  hx.strokeStyle = color; hx.lineWidth = lw * hudK; hx.lineCap = "butt"; hx.stroke();
}
function gDisk(cx, cy, r) {
  hx.beginPath(); hx.arc(cx, cy, r, 0, Math.PI * 2);
  hx.fillStyle = "rgba(13,13,13,0.5)"; hx.fill();
}
function gTicks(cx, cy, r, max, minor, major, labelEvery, labelDiv, labelPx) {
  for (let v = 0; v <= max + 0.001; v += minor) {
    const f = v / max, isMajor = Math.abs(v % major) < 0.001;
    const a = gAng(f), len = (isMajor ? 12 : 6) * hudK;
    hx.beginPath();
    hx.moveTo(cx + Math.cos(a) * (r - len), cy + Math.sin(a) * (r - len));
    hx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    hx.strokeStyle = isMajor ? "rgba(240,237,230,0.9)" : "rgba(240,237,230,0.45)";
    hx.lineWidth = (isMajor ? 1.6 : 1) * hudK; hx.stroke();
    if (Math.abs(v % labelEvery) < 0.001) {
      const lr = r - 25 * hudK;
      hText(String(Math.round(v / labelDiv)), cx + Math.cos(a) * lr, cy + Math.sin(a) * lr, labelPx, 500, "rgba(240,237,230,0.85)");
    }
  }
}

const TIRE_COLOR = { SOFT: C.red, MEDIUM: C.yellow, HARD: C.white, INTERMEDIATE: "#7CFF9B", WET: "#6FB4FF" };

function drawHud(st) {
  hx.clearRect(0, 0, HW, HH);
  if (!hudOn || !HW) return;
  const k = hudK, live = !!(st && st.live);
  st = st || { live: false };
  hx.save();
  hx.shadowColor = "rgba(0,0,0,0.65)"; hx.shadowBlur = 4 * k;

  const num = (v, d) => (v == null || !isFinite(v)) ? "--" : (d ? v.toFixed(d) : String(Math.round(v)));

  /* ---------- speed dial (centre bottom) ---------- */
  const cx = HW / 2, cy = HH - 150 * k, r = 125 * k;
  gDisk(cx, cy, r + 12 * k);
  gArc(cx, cy, r, 0, 1, "rgba(240,237,230,0.35)", 1.6);
  const sp = st.speed == null ? 0 : st.speed;
  gArc(cx, cy, r - 15 * k, 0, 1, "rgba(61,61,61,0.7)", 8);
  gArc(cx, cy, r - 15 * k, 0, Math.min(1, sp / SPEED_MAX), C.yellow, 8);
  gTicks(cx, cy, r, SPEED_MAX, 10, 40, 40, 1, 12);
  hText(num(st.speed), cx, cy - 4 * k, 92, 700, C.white);
  hText("KM/H", cx, cy + 48 * k, 14, 500, "rgba(240,237,230,0.8)");
  const drsOn = st.drs != null && st.drs >= 10;
  hx.beginPath(); hx.roundRect(cx - 24 * k, cy + 64 * k, 48 * k, 20 * k, 4 * k);
  hx.fillStyle = drsOn ? C.yellow : "rgba(61,61,61,0.7)"; hx.fill();
  hText("DRS", cx, cy + 74.5 * k, 13, 700, drsOn ? C.black : "rgba(240,237,230,0.6)");

  /* ---------- revs and gear (left) ---------- */
  const lx = cx - 250 * k, ly = HH - 110 * k, lr = 88 * k;
  gDisk(lx, ly, lr + 10 * k);
  gArc(lx, ly, lr, 0, 1, "rgba(240,237,230,0.35)", 1.6);
  gArc(lx, ly, lr - 12 * k, 0, RPM_REDLINE / RPM_MAX, "rgba(61,61,61,0.7)", 7);
  gArc(lx, ly, lr - 12 * k, RPM_REDLINE / RPM_MAX, 1, "rgba(255,60,60,0.55)", 7);
  const rp = st.rpm == null ? 0 : st.rpm;
  gArc(lx, ly, lr - 12 * k, 0, Math.min(1, Math.min(rp, RPM_REDLINE) / RPM_MAX), C.yellow, 7);
  if (rp > RPM_REDLINE) gArc(lx, ly, lr - 12 * k, RPM_REDLINE / RPM_MAX, Math.min(1, rp / RPM_MAX), C.red, 7);
  gTicks(lx, ly, lr, RPM_MAX, 1000, 3000, 3000, 1000, 10);
  const g = st.gear;
  hText(g == null ? "-" : (g === 0 ? "N" : String(g)), lx, ly - 2 * k, 74, 700, C.white);
  hText(num(st.rpm) + " RPM", lx, ly + 48 * k, 11, 500, "rgba(240,237,230,0.8)");

  /* ---------- throttle (outer) and brake (inner) (right) ---------- */
  const rx = cx + 250 * k, ry = HH - 110 * k, rr = 88 * k;
  gDisk(rx, ry, rr + 10 * k);
  gArc(rx, ry, rr, 0, 1, "rgba(240,237,230,0.35)", 1.6);
  gArc(rx, ry, rr - 12 * k, 0, 1, "rgba(61,61,61,0.7)", 7);
  gArc(rx, ry, rr - 12 * k, 0, Math.min(1, (st.thr || 0) / 100), C.yellow, 7);
  gArc(rx, ry, rr - 26 * k, 0, 1, "rgba(61,61,61,0.7)", 7);
  const brakeOn = (st.brk || 0) > 0;
  gArc(rx, ry, rr - 26 * k, 0, brakeOn ? Math.min(1, (st.brk || 0) / 100) : 0, C.red, 7);
  hText(num(st.thr), rx, ry - 12 * k, 40, 700, C.white);
  hText("THROTTLE", rx, ry + 12 * k, 10, 500, "rgba(240,237,230,0.8)");
  hText(brakeOn ? "BRAKE" : "", rx, ry + 30 * k, 12, 700, C.red);

  /* ---------- lap clock, sectors, delta (top centre) ---------- */
  const tx = cx, ty = 40 * k;
  hText(live ? fmtLap(st.el) : "0:00.000", tx, ty, 46, 700, C.white);
  hText(live ? "LAP " + st.lapNo : "LAP --", tx, ty - 28 * k, 13, 500, "rgba(240,237,230,0.8)");
  const bw = 96 * k, gap = 8 * k, by = ty + 34 * k;
  const secs = (st.sect || []).map(v => (v > 0 ? v * 1000 : 0));
  let acc = 0;
  for (let i = 0; i < 3; i++) {
    const x0 = tx - 1.5 * bw - gap + i * (bw + gap);
    hx.fillStyle = "rgba(61,61,61,0.8)"; hx.fillRect(x0, by, bw, 6 * k);
    if (live && secs[i]) {
      const f = Math.max(0, Math.min(1, (st.el - acc) / secs[i]));
      hx.fillStyle = f >= 1 ? C.yellow : C.white; hx.fillRect(x0, by, bw * f, 6 * k);
      hText("S" + (i + 1), x0 + 10 * k, by + 18 * k, 11, 500, "rgba(240,237,230,0.8)");
      if (f >= 1) hText((secs[i] / 1000).toFixed(3), x0 + bw - 24 * k, by + 18 * k, 12, 500, C.white);
      acc += secs[i];
    } else hText("S" + (i + 1), x0 + 10 * k, by + 18 * k, 11, 500, "rgba(240,237,230,0.5)");
  }
  if (live && st.delta != null) {
    const dy = by + 46 * k, half = 70 * k, d = Math.max(-2, Math.min(2, st.delta));
    hx.fillStyle = "rgba(61,61,61,0.8)"; hx.fillRect(tx - half, dy, half * 2, 4 * k);
    hx.fillStyle = st.delta <= 0 ? C.yellow : C.red;
    hx.fillRect(Math.min(tx, tx + d / 2 * half), dy - 3 * k, Math.abs(d / 2 * half), 10 * k);
    hx.fillStyle = C.white; hx.fillRect(tx - 1 * k, dy - 6 * k, 2 * k, 16 * k);
    hText((st.delta > 0 ? "+" : "") + st.delta.toFixed(3), tx, dy + 26 * k, 22, 700, st.delta <= 0 ? C.yellow : C.red);
    hText("VS LAP " + st.refLapNo, tx, dy + 46 * k, 11, 500, "rgba(240,237,230,0.7)");
  }

  /* ---------- position, driver, tire (top left) ---------- */
  const px0 = 26 * k, py0 = 64 * k;
  hText(st.pos ? "P" + st.pos : "P--", px0, py0, 58, 700, C.white, "left");
  if (curDriver) {
    const tc = curDriver.team_colour ? "#" + curDriver.team_colour : C.char;
    hx.fillStyle = tc; hx.fillRect(px0, py0 + 38 * k, 5 * k, 38 * k);
    hText((curDriver.name_acronym || "") + "  " + curDriver.driver_number, px0 + 14 * k, py0 + 48 * k, 22, 700, C.white, "left");
    hText(curDriver.team_name || "", px0 + 14 * k, py0 + 68 * k, 13, 500, "rgba(240,237,230,0.8)", "left");
  }
  if (st.tire) {
    const tcx = px0 + 190 * k, tcy = py0 + 2 * k, col = TIRE_COLOR[st.tire] || C.white;
    hx.beginPath(); hx.arc(tcx, tcy, 18 * k, 0, Math.PI * 2);
    hx.strokeStyle = col; hx.lineWidth = 5 * k; hx.stroke();
    hText(st.tire[0], tcx, tcy, 18, 700, C.white);
    hText(st.tireAge != null ? st.tireAge + " LAPS" : "", tcx, tcy + 32 * k, 11, 500, "rgba(240,237,230,0.8)");
  }

  /* ---------- mini map (bottom left) ---------- */
  if (mapInfo && trackEN.length) {
    const box = 150 * k, mx0 = 18 * k, my0 = HH - box - 44 * k;
    hx.fillStyle = "rgba(13,13,13,0.45)"; hx.beginPath(); hx.roundRect(mx0, my0, box, box, 8 * k); hx.fill();
    const pad = 14 * k, w = mapInfo.maxE - mapInfo.minE, h = mapInfo.maxN - mapInfo.minN;
    const sc = Math.min((box - 2 * pad) / w, (box - 2 * pad) / h);
    const ox = mx0 + (box - w * sc) / 2, oy = my0 + (box - h * sc) / 2;
    const mp = p => [ox + (p[0] - mapInfo.minE) * sc, oy + (mapInfo.maxN - p[1]) * sc];
    hx.beginPath();
    trackEN.forEach((p, i) => { const q = mp(p); if (i) hx.lineTo(q[0], q[1]); else hx.moveTo(q[0], q[1]); });
    hx.closePath();
    hx.strokeStyle = "rgba(240,237,230,0.75)"; hx.lineWidth = 2 * k; hx.stroke();
    const s0 = mp(trackEN[0]);
    hx.fillStyle = C.white; hx.fillRect(s0[0] - 3 * k, s0[1] - 3 * k, 6 * k, 6 * k);
    if (live) {
      const N = trackEN.length;
      (st.ghostS || []).forEach(gs => {
        const i = ((Math.floor(gs) % N) + N) % N, q = mp(trackEN[i]);
        hx.beginPath(); hx.arc(q[0], q[1], 3 * k, 0, Math.PI * 2); hx.fillStyle = "rgba(232,255,0,0.4)"; hx.fill();
      });
      const i = ((Math.floor(st.sCur) % N) + N) % N, q = mp(trackEN[i]);
      hx.beginPath(); hx.arc(q[0], q[1], 5.5 * k, 0, Math.PI * 2); hx.fillStyle = C.yellow; hx.fill();
      hx.strokeStyle = C.black; hx.lineWidth = 1.5 * k; hx.stroke();
    }
  }

  /* ---------- lap progress ring (bottom right) ---------- */
  {
    const gx = HW - 76 * k, gy = HH - 96 * k, gr = 42 * k;
    gDisk(gx, gy, gr + 8 * k);
    hx.beginPath(); hx.arc(gx, gy, gr, 0, Math.PI * 2);
    hx.strokeStyle = "rgba(240,237,230,0.25)"; hx.lineWidth = 6 * k; hx.stroke();
    const pr = live ? st.prog : 0;
    hx.beginPath(); hx.arc(gx, gy, gr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pr);
    hx.strokeStyle = C.yellow; hx.lineWidth = 6 * k; hx.stroke();
    hText(Math.round(pr * 100) + "%", gx, gy - 3 * k, 26, 700, C.white);
    hText("LAP", gx, gy + 20 * k, 10, 500, "rgba(240,237,230,0.8)");
  }
  hx.restore();
}

/* ============================================================
   PANEL
   ============================================================ */
function setupPanel() {
  document.getElementById("playBtn").onclick = () => playLap();
  document.getElementById("overviewBtn").onclick = () => showOverview();
  document.getElementById("hudBtn").onclick = () => {
    hudOn = !hudOn;
    document.getElementById("hudBtn").textContent = "HUD: " + (hudOn ? "on" : "off");
    drawHud(lastHudState);
  };
  document.getElementById("panelToggle").onclick = () => {
    const body = document.getElementById("panelBody");
    const hide = body.style.display !== "none";
    body.style.display = hide ? "none" : "flex";
    document.getElementById("panelToggle").textContent = hide ? "Show controls" : "Hide controls";
  };
  document.getElementById("raceSel").onchange = e => loadAll(Number(e.target.value), null).catch(err => { log("FAILED: " + err.message); console.error(err); });
  document.getElementById("driverSel").onchange = e => loadAll(curSessionKey, Number(e.target.value)).catch(err => { log("FAILED: " + err.message); console.error(err); });
  document.getElementById("lapSel").onchange = e => { currentLapIndex = Number(e.target.value); prefetchLap(currentLapIndex); };

  /* each control is a tap-to-type number input flanked by - / + buttons (tap, or hold to repeat) */
  const controls = {
    zoom: { id: "zoomVal", min: 0.3, max: 4.0, onChange: v => { zoomMultiplier = v; } },
    camH: { id: "camHVal", min: 1,   max: 500, onChange: v => { cameraHeightM = v; } },
    camB: { id: "camBVal", min: 0,   max: 300, onChange: v => { cameraBackM = v; } },
    camP: { id: "camPVal", min: -90, max: -5,  onChange: v => { cameraPitchDeg = v; } },
  };
  Object.keys(controls).forEach(ctl => {
    const { id, min, max, onChange } = controls[ctl];
    const input = document.getElementById(id);
    const step = Number(input.step) || 1;
    const commit = (v) => { v = Math.max(min, Math.min(max, v)); input.value = v; onChange(v); };
    input.addEventListener("change", () => commit(Number(input.value) || 0));
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
    document.querySelectorAll(`.stepBtn[data-ctl="${ctl}"]`).forEach(btn => {
      const dir = Number(btn.dataset.dir);
      let repeatTimer = null, holdTimeout = null, ticks = 0;
      const doStep = () => commit(Math.round((Number(input.value) + dir * step) * 100) / 100);
      const startHold = () => {
        doStep();
        holdTimeout = setTimeout(() => {
          repeatTimer = setInterval(() => {
            ticks++;
            doStep();
            if (ticks === 15 && repeatTimer) { clearInterval(repeatTimer); repeatTimer = setInterval(doStep, 60); }
          }, 100);
        }, 400);
      };
      const stopHold = () => { clearTimeout(holdTimeout); clearInterval(repeatTimer); repeatTimer = null; ticks = 0; };
      btn.addEventListener("pointerdown", (e) => { e.preventDefault(); startHold(); });
      btn.addEventListener("pointerup", stopHold);
      btn.addEventListener("pointerleave", stopHold);
      btn.addEventListener("pointercancel", stopHold);
    });
  });
}

init();
</script>
